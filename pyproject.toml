[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loadcast"
version = "0.1.0"
description = "Synthetic multi-carrier industrial energy demand profiles with controllable cross-carrier structure"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Matteo Hauglustaine", email = "matteo@abeo.be" },
]
keywords = [
    "energy",
    "demand",
    "load profile",
    "industrial",
    "synthetic data",
    "time series",
    "heat",
    "cooling",
    "multi-carrier",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7.0"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0", "mkdocstrings[python]>=0.24"]
dev = ["loadcast[plot,test,docs]"]

[project.urls]
Homepage = "https://github.com/Matt-haug/loadcast"
Documentation = "https://loadcast.readthedocs.io"
Repository = "https://github.com/Matt-haug/loadcast"
Issues = "https://github.com/Matt-haug/loadcast/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loadcast = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

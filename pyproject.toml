[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loadcast"
dynamic = ["version"]
description = "Synthetic multi-carrier industrial energy demand profiles with controllable cross-carrier structure"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
# Names only, so all three appear together as authors on PyPI; an email would
# move a name to the separate Author-email field. The contact is the maintainer.
authors = [
    { name = "Matteo Hauglustaine" },
    { name = "Ward De Paepe" },
    { name = "Francesco Contino" },
]
maintainers = [
    { name = "Matteo Hauglustaine", email = "matteo@abeo.be" },
]
keywords = [
    "energy",
    "demand",
    "load profile",
    "industrial",
    "synthetic data",
    "time series",
    "heat",
    "cooling",
    "multi-carrier",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7.0"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.0", "mkdocstrings[python]>=0.24"]
dev = ["loadcast[plot,test,docs]"]

[project.urls]
Homepage = "https://github.com/Matt-haug/loadcast"
Documentation = "https://loadcast.readthedocs.io"
Repository = "https://github.com/Matt-haug/loadcast"
Issues = "https://github.com/Matt-haug/loadcast/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loadcast = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools_scm]
# The version is the git tag of the release (v0.1.2 -> 0.1.2). A build with no
# git history at all, such as an unpacked GitHub zip, falls back to this.
fallback_version = "0.0.0"

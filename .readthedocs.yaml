# Read the Docs build configuration.
# Import the repo at readthedocs.org and this file does the rest.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # The tags set the package version; Read the Docs clones shallow.
      - git fetch --unshallow --tags || true

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
